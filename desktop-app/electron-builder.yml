# Build & distribution Windows (docs/01 §7).
# La publication GitHub Releases sera branchée en Phase 4 (CI sur tag vX.Y.Z).
appId: com.supernon0.multioutils
productName: MultiOutils
# La recompilation native (better-sqlite3 → ABI Electron) est faite par
# `npm run rebuild:electron` (racine) AVANT le packaging ; electron-builder ne
# relance donc pas d'installation (récursif en monorepo npm workspaces).
npmRebuild: false
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - resources/**
  - package.json
# tesseract.js lance un worker thread depuis ses fichiers : hors asar
asarUnpack:
  - node_modules/tesseract.js/**
  - node_modules/tesseract.js-core/**
win:
  target:
    - nsis
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: MultiOutils-Setup-${version}.${ext}
  shortcutName: MultiOutils
publish:
  provider: github
  owner: SuperNon0
  repo: MultiOutils
  releaseType: release
