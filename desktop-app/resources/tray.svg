  <g fill="none" stroke="#e7ebf3" stroke-width="2.4" stroke-linejoin="round">
    <rect x="6.7" y="6.7" width="7" height="7" rx="1.8"/>
    <rect x="6.7" y="18.3" width="7" height="7" rx="1.8"/>
    <rect x="18.3" y="18.3" width="7" height="7" rx="1.8"/>
  </g>
  <rect x="17.1" y="5.5" width="9.4" height="9.4" rx="2.8" fill="#a99bff"/>
</svg>
