name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Les binaires natifs (Electron, better-sqlite3) ne sont pas nécessaires
      # pour vérifier types, tests et bundling.
      - name: Installer les dépendances
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      - name: Tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build de l'app (bundles main/preload/renderer)
        run: npm run build:app

  windows-check:
    name: Tests et compilation sous Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

      # Le lockfile créé sur Linux peut manquer le binaire Rollup Windows.
      - name: Installer le binaire Rollup Windows
        shell: pwsh
        run: |
          $version = node -p "require('rollup/package.json').version"
          npm install --no-save --ignore-scripts --package-lock=false "@rollup/rollup-win32-x64-msvc@$version"

      - name: Tests
        run: npm run test

      - name: Typecheck
        run: npm run typecheck

      - name: Build de l'app (bundles main/preload/renderer)
        run: npm run build:app
