# Construit l'installeur Windows à chaque push sur une branche de travail et
# le met à disposition en ARTEFACT (onglet Actions → run → Artifacts).
# La publication officielle en GitHub Release reste build-desktop.yml (tag vX.Y.Z).
name: Installeur (branche)

on:
  push:
    branches: ['claude/**']

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les dépendances
        # Le package-lock.json est généré sur Linux : sur le runner Windows,
        # npm ci ne réinstalle pas les binaires optionnels propres à la
        # plateforme (rollup/esbuild win32 — bug npm #4828). On repart donc
        # d'une résolution propre.
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund

      - name: Recompiler better-sqlite3 pour Electron
        run: npx electron-rebuild -v 33.4.11 -f -w better-sqlite3 -m .

      - name: Construire l'installeur (sans publication)
        run: npm run dist -w desktop-app

      - name: Publier l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: MultiOutils-Setup
          path: desktop-app/release/*.exe
          retention-days: 14
