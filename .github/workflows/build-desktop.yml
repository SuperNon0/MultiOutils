# Build de l'installeur Windows + publication GitHub Release à chaque tag
# vX.Y.Z (docs/01 §7). electron-updater lit ensuite ces releases pour la mise
# à jour à la demande (docs/00 §5.3).
name: Build desktop

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write # publication de la release + des artefacts

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Installation complète : télécharge Electron et recompile les modules
      # natifs (better-sqlite3) pour l'ABI d'Electron.
      - name: Installer les dépendances
        run: npm ci

      - name: Tests + typecheck
        run: |
          npm test
          npm run typecheck

      - name: Construire et publier l'installeur
        run: npm run release -w desktop-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
