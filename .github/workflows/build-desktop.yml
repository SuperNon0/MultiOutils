# Build de l'installeur Windows + publication GitHub Release (docs/01 §7).
# electron-updater lit ensuite ces releases pour la mise à jour à la demande
# (docs/00 §5.3).
#
# Publication automatique : à chaque push sur `main`, on lit la version dans
# desktop-app/package.json. Si la release `v<version>` n'existe pas encore, on
# construit ET on publie ; sinon on construit seulement (pas de doublon). Il
# suffit donc de bumper la version dans package.json et de merger sur `main`
# pour publier une nouvelle release — electron-builder crée le tag `v<version>`
# et la release via l'API GitHub (aucun push de tag manuel nécessaire).
#
# Chaque release porte aussi le plugin Stream Deck empaqueté
# (MultiOutils-StreamDeck.streamDeckPlugin) : le job le joint à la release,
# qu'elle soit nouvelle ou déjà existante (docs/00 §8).
name: Build desktop

on:
  push:
    branches: [main]
    # On ne relance le build/publication que si l'app desktop (ou ce workflow)
    # change — un bump de version touche desktop-app/package.json, donc les
    # vraies releases déclenchent bien. Les commits serveur/install/docs sur
    # `main` n'entraînent pas de build Windows inutile.
    paths:
      - 'desktop-app/**'
      - 'packages/shared/**'
      - 'streamdeck-plugin/**'
      - '.github/workflows/build-desktop.yml'
    tags: ['v*.*.*']
  # Déclenchement manuel (onglet Actions → Build desktop → Run workflow) :
  # construit l'installeur depuis la branche choisie et publie la release.
  workflow_dispatch:

permissions:
  contents: write # publication de la release + des artefacts

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Le package-lock.json est généré sur Linux : sur le runner Windows,
      # npm ci ne réinstalle pas les binaires optionnels propres à la
      # plateforme (rollup/esbuild win32 — bug npm #4828). On repart d'une
      # résolution propre, qui télécharge aussi Electron.
      - name: Installer les dépendances
        shell: bash
        run: |
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund

      - name: Tests + typecheck
        run: |
          npm test
          npm run typecheck

      - name: Recompiler better-sqlite3 pour Electron
        run: npx electron-rebuild -v 33.4.11 -f -w better-sqlite3 -m .

      # Lit la version cible et détermine si la release existe déjà, pour éviter
      # de republier (et donc de faire échouer le job) sur un push `main` qui ne
      # change pas la version.
      - name: Déterminer la version et l'état de la release
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop-app/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "La release v$VERSION existe déjà — construction sans publication."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Nouvelle version v$VERSION — construction et publication."
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Empaquette le plugin Stream Deck en fichier .streamDeckPlugin
      # (double-clic = installation) avec la CLI officielle Elgato, pour le
      # joindre à la release à côté de l'installeur (docs/00 §8).
      - name: Empaqueter le plugin Stream Deck
        shell: bash
        run: |
          npm run build -w streamdeck-plugin
          mkdir -p sd-dist
          npx --yes @elgato/cli@1.7.4 pack \
            streamdeck-plugin/com.supernon0.multioutils.sdPlugin \
            --output sd-dist --force
          mv "sd-dist/com.supernon0.multioutils.streamDeckPlugin" \
             "sd-dist/MultiOutils-StreamDeck.streamDeckPlugin"
          ls -la sd-dist

      - name: Construire et publier la release
        if: steps.version.outputs.exists == 'false'
        run: npm run release -w desktop-app
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire l'installeur (release déjà publiée)
        if: steps.version.outputs.exists == 'true'
        run: npm run dist -w desktop-app

      # Joint le plugin Stream Deck à la release (nouvelle OU déjà existante) :
      # --clobber remplace l'asset si on repasse dessus. Toute release porte
      # ainsi l'installeur ET le plugin téléchargeables.
      - name: Joindre le plugin Stream Deck à la release
        shell: bash
        run: |
          gh release upload "v${{ steps.version.outputs.version }}" \
            "sd-dist/MultiOutils-StreamDeck.streamDeckPlugin" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Rend l'installeur + le plugin téléchargeables depuis l'onglet Actions
      # même quand la release existe déjà (re-télécharger sans re-publier).
      - name: Publier l'artefact
        if: steps.version.outputs.exists == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: MultiOutils-Setup
          path: |
            desktop-app/dist/*Setup*.exe
            sd-dist/MultiOutils-StreamDeck.streamDeckPlugin
          if-no-files-found: warn
